# 依赖更新：暂停自动 PR（open-pull-requests-limit: 0）。
#
# 原因（2026-10-29 实测）：本插件的宿主包全部声明为 peerDependencies，由 DSH 宿主提供；
# 而 Dependabot 重算 pnpm-lock.yaml 时会 autoInstallPeers，把宿主的整棵依赖树写进
# devDependencies 的锁文件里。三次实证：
#   - typescript 5.9.3 → 7.0.2：lockfile +357 行，新增 28 个 @deepseek-ai/dsh-* 与
#     @typescript/typescript-* 平台包，并带进 zod@4.6.5 的 high 漏洞，
#     使 CI 的 `pnpm audit --prod --audit-level=high` 直接失败；
#   - @deepseek-ai/schemastery 3.18.1 → 3.18.5（只改 lockfile）：dsh-settings 按不同
#     peer 组合被拆成 3 个实例，settings 命名空间注册与查找落到不同实例，CI 红；
#   - 每个 PR 都会重写整张锁文件，彼此之间必然产生 lockfile 冲突。
#
# 依赖升级改走本地，逐项验证后提交：
#   pnpm update <pkg>
#   pnpm run verify
#   pnpm audit --prod --audit-level=high
#   git diff pnpm-lock.yaml        # 确认没有把宿主依赖树带进来
# 保留本文件是为了留住生态配置与检查周期，将来若改为 hosted 依赖再放开 limit。
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # 0 = 只做版本检查，不自动开 PR
    open-pull-requests-limit: 0
